<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKED BY HANIF</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');
        body {
            background-color: #000000;
            color: #ff0000;
            text-align: center;
            font-family: 'Creepster', cursive;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        h1 {
            margin-top: 50px;
            font-size: 60px;
            text-shadow: 3px 3px 10px #ff0000, -1px -1px 10px #fff;
            animation: flicker 2s infinite alternate;
        }

        .hack-message {
            font-size: 28px;
            text-shadow: 2px 2px 8px #fff, -2px -2px 8px #ff0000;
            margin-top: 20px;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        img {
            margin-top: 50px;
            border: 5px solid #ff0000;
            box-shadow: 0 0 20px red;
            filter: hue-rotate(200deg) saturate(200%);
            width: 500px;
            animation: glitch 2s infinite;
        }

        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            color: #ffffff;
            font-size: 18px;
            font-family: 'Arial', sans-serif;
            text-shadow: 0 0 10px red;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(2px, -2px); }
            40% { transform: translate(-2px, 2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(-2px, -2px); }
            100% { transform: translate(0); }
        }

        .static-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://media.giphy.com/media/3o6Ztb1lcJxIFPvYVW/giphy.gif') repeat;
            opacity: 0.2;
            z-index: -1;
        }

        .red-glow {
            animation: redGlow 3s infinite;
        }

        @keyframes redGlow {
            0% { text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff0000; }
            50% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000; }
            100% { text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff0000; }
        }
    </style>
</head>
<body>
    <div class="static-bg"></div>
    <h1 class="red-glow">HACKED BY HANIF</h1>
    <p class="hack-message">We are watching you...</p>

    <!-- Replace the src link with a more fitting scary image -->
    <img src="https://img.freepik.com/free-vector/skull-with-glitch-effect_225004-657.jpg" alt="Hacked Image">

    <footer>
        Your website is under our control now. There's no escape.
    </footer>
</body>
</html>
